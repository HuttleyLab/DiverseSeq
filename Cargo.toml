[package]
name = "diverse_seq"
version = "2026.9.24"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module"], optional = true }
zarrs = { version = "0.23.14", features = ["zstd"] }
zarrs_storage = { version = "0.4.5" }
rustc-hash = "2.1.3"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.0", features = ["alloc"] }
serde_json = "1.0.151"

[features]
default = ["python"]
python = ["pyo3"]    # this allows testing python code
rust-only = []       # this allows testing rust-only code

[dev-dependencies]
rstest = "0.27.0"
tempfile = "3.27.0"
